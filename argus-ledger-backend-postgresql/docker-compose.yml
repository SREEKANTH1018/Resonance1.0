services:
  db:
    image: postgres:16
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus_password}
    ports:
      # Host 5433 by default so this coexists with a locally-installed
      # PostgreSQL on 5432. The api container still reaches it as db:5432.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: argus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Fixed to the compose network host — NOT ${DATABASE_URL}, because the
      # repo .env carries a localhost URL for local (non-Docker) runs and that
      # would resolve to the api container itself.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus_password}@db:5432/${POSTGRES_DB:-argus}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      HUMAN_REVIEW_CONFIDENCE_THRESHOLD: ${HUMAN_REVIEW_CONFIDENCE_THRESHOLD:-0.7}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
